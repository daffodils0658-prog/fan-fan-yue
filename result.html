<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聚餐結果 - 約吃飯</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; padding: 20px; color: #333; }
        .result-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .highlight { color: #ff6b6b; font-size: 24px; font-weight: bold; margin: 10px 0; }
        .restaurant { background: #f1f3f5; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; }
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="result-card">
        <h2>🎉 時間敲定！</h2>
        <p>最多人有空的時間是：</p >
        <div class="highlight">週五晚上 19:00</div>
        
        <p style="margin-top: 30px;">為您推薦的餐廳：</p >
        <div class="restaurant">
            <h3>🍲 老四川麻辣鍋</h3>
            <p style="color: #666; font-size: 14px;">距離大家的中間點最近 (約 1.2 公里)<br>預算：約 500 元/人</p >
        </div>
        
        <a href=" " class="btn-back">回首頁</a >
    </div>
</body>
</html>
